<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#070b14" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>

    <!-- Cyan to Mint Pulse Gradient -->
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Elephant Shading Gradient -->
    <linearGradient id="elephantGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Modern App Icon Badge Base -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="4" />

  <!-- Concentric Replication Stream Orbits -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.4" />
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#pulseGrad)" stroke-width="2" opacity="0.25" />

  <!-- Geometric PostgreSQL Elephant (Slonik Silhouette) -->
  <g id="elephant-symbol">
    <!-- Main Elephant Head & Ear Shape -->
    <path d="
      M 256,120
      C 295,120 330,135 355,165
      C 385,155 415,180 410,225
      C 405,260 375,280 345,275
      L 345,250
      C 340,265 328,275 315,280
      L 315,325
      C 315,355 295,365 275,365
      C 255,365 235,355 235,325
      L 235,280
      C 222,275 210,265 205,250
      L 205,275
      C 175,280 145,260 140,225
      C 135,180 165,155 195,165
      C 220,135 255,120 256,120 Z
    " fill="url(#elephantGrad)" stroke="#38bdf8" stroke-width="3.5" stroke-linejoin="round" />

    <!-- Inner Ear Contour (Acoustic Replication Chamber) -->
    <path d="M 188,185 C 160,180 152,205 155,230 C 158,245 172,252 190,248 Z" fill="#0ea5e9" opacity="0.3" />
    <path d="M 324,185 C 352,180 360,205 357,230 C 354,245 340,252 322,248 Z" fill="#0ea5e9" opacity="0.3" />

    <!-- Sleek Curved Tusks -->
    <path d="M 215,285 C 195,305 190,330 215,340 C 220,328 222,305 222,288 Z" fill="#38bdf8" filter="url(#softGlow)" />
    <path d="M 297,285 C 317,305 322,330 297,340 C 292,328 290,305 290,288 Z" fill="#38bdf8" filter="url(#softGlow)" />

    <!-- Focused Intelligent Eyes -->
    <circle cx="225" cy="215" r="7" fill="#0b1329" stroke="#38bdf8" stroke-width="2" />
    <circle cx="225" cy="215" r="3.5" fill="#10b981" />
    <circle cx="287" cy="215" r="7" fill="#0b1329" stroke="#38bdf8" stroke-width="2" />
    <circle cx="287" cy="215" r="3.5" fill="#10b981" />

    <!-- LSN Keyhole in Trunk -->
    <circle cx="256" cy="318" r="6" fill="#38bdf8" />
    <polygon points="252,320 260,320 262,342 250,342" fill="#38bdf8" />
  </g>

  <!-- Horizontal Streaming WAL Pulse Line (Heartbeat / Oscilloscope) -->
  <g id="pulse-waveform">
    <!-- Background Glow Trace -->
    <path d="
      M 50,256
      L 140,256
      L 165,256
      L 185,220
      L 205,290
      L 225,256
      L 256,256
      L 270,180
      L 290,330
      L 310,210
      L 325,275
      L 340,256
      L 375,256
      L 395,235
      L 410,275
      L 425,256
      L 462,256
    " fill="none" stroke="url(#pulseGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.3" filter="url(#neonGlow)" />

    <!-- Crisp Foreground Pulse -->
    <path d="
      M 50,256
      L 140,256
      L 165,256
      L 185,220
      L 205,290
      L 225,256
      L 256,256
      L 270,180
      L 290,330
      L 310,210
      L 325,275
      L 340,256
      L 375,256
      L 395,235
      L 410,275
      L 425,256
      L 462,256
    " fill="none" stroke="url(#pulseGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Pulse Peak LSN Nodes (Event Checkpoints) -->
    <circle cx="270" cy="180" r="6" fill="#10b981" filter="url(#softGlow)" />
    <circle cx="270" cy="180" r="2.5" fill="#ffffff" />

    <circle cx="290" cy="330" r="6" fill="#06b6d4" filter="url(#softGlow)" />
    <circle cx="290" cy="330" r="2.5" fill="#ffffff" />

    <circle cx="395" cy="235" r="5" fill="#38bdf8" />
    <circle cx="410" cy="275" r="5" fill="#10b981" />
  </g>

  <!-- Flowing WAL Packets / Hexagons -->
  <g id="data-packets">
    <!-- Leading Data Packet -->
    <polygon points="445,250 455,250 460,256 455,262 445,262 440,256" fill="#10b981" filter="url(#softGlow)" />
    <!-- Trailing Data Packet -->
    <polygon points="65,250 75,250 80,256 75,262 65,262 60,256" fill="#06b6d4" opacity="0.7" />
  </g>
</svg>
